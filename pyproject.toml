[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shamonda-virus-phylogenomics"
version = "0.1.0"
requires-python = ">=3.12"
description = "Reproducible, segment-specific Shamonda virus genomic epidemiology"
dependencies = ["biopython==1.86", "numpy==2.3.5", "scipy==1.16.3", "matplotlib==3.10.8"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "mypy==1.19.1", "ruff==0.14.10", "types-requests==2.32.4.20250913"]

[tool.setuptools.packages.find]
include = ["shav*"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["Bio.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

